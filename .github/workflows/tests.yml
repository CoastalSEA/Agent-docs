name: tests

# Runs the script and framework tests on Windows, macOS and Linux.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show versions
        run: |
          python --version
          git --version
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install into a scratch folder (init, apply, hooks, doctor)
        shell: bash
        run: |
          target="${{ runner.temp }}/claude-target"
          python deploy.py init --yes --target "$target"
          python deploy.py apply --yes --target "$target"
          python deploy.py hooks --yes --retention-notice --target "$target"
          python deploy.py doctor --target "$target"
          python deploy.py status --target "$target"
