name: tests

# Runs the script and framework tests on Windows, macOS and Linux.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show versions
        run: |
          python --version
          git --version
      - name: Run tests
        run: python -m unittest discover -s tests -v
